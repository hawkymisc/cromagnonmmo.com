name: 提案・新しい機能 / Suggestion or new feature
description: 新しい機能や改善のアイデアを送る / Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        アイデアをありがとうございます。提案する機能と、どのように役立つかを教えてください。実装したプルリクエストも歓迎します。
        Thank you for your idea. Describe the feature and how it would help. Pull requests implementing suggestions are welcome too.
  - type: textarea
    id: idea
    attributes:
      label: 提案したいこと / Your idea
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: なぜあるとよいか / Why it would help
  - type: checkboxes
    id: build
    attributes:
      label: 自分で作るか / Building it yourself
      options:
        - label: 自分で作ってプルリクエストを送るつもりです / I plan to build it and send a pull request
  - type: checkboxes
    id: conduct
    attributes:
      label: 行動規範 / Code of conduct
      options:
        - label: '[行動規範](https://github.com/yurinakanishi/cromagnonmmo.com/blob/main/CODE_OF_CONDUCT.md)を守ります / I will follow the [Code of conduct](https://github.com/yurinakanishi/cromagnonmmo.com/blob/main/CODE_OF_CONDUCT.md)'
          required: true
